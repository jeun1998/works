<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    .male {
        color: rgb(10, 238, 143);
    }

    .female {
        color: rgb(173, 22, 105);
    }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        window.onload = () => {
            document.querySelector("#frm").onsubmit = showCustomers;
        };

        function showCustomers(event){
            const idInput = document.querySelector("#userId");
            const pwdInput = document.querySelector("#userPwd");
            const result = document.querySelector("#result");

            if (idInput.value.trim() !== "python" ||
                pwdInput.value !== "123") {
                result.innerHTML = "";
                alert("아이디 또는 비밀번호가 틀렸습니다.");
                pwdInput.focus();
                return;

            }
            const xhr = new XMLHttpRequest();
            xhr.open("GET", "gogekdata.json", true);
            result.innerText = "고객 정보를 불러오는 중...";

            xhr.onreadystatechange = function(){
                if(xhr.readyState !== 4){
                    return;
                }
                if(xhr.status === 200){
                    const data = JSON.parse(xhr.responseText);
                    let output = `
                        <table>
                            <tr>
                                <th>고객명</th>
                                <th>고객전화</th>
                                <th>성별</th>
                            </tr>
                            <tbody>
                    `;

                    for (let i = 0; i < data.length; i++){
                        const colorClass = 
                            data[i].gender === "남" ? "male" : "female";
                        output += `
                            <tr>
                                <td class="${colorClass}">
                                    ${data[i].name}
                                </td>
                                <td>${data[i].tel}</td>
                                <td>${data[i].gender}</td>
                            </tr>
                        `;
                    }
                    output += "</tbody></table>";
                    result.innerHTML = output;
                } else {
                    result.innerText = "로딩 실패: " + xhr.status;
                }
            };
            xhr.send();
        }
        
    </script>
</head>
<body>
    <h2>직원정보 입력</h2>

    <form id="frm">
        <div class="input-row">
            <label for="userId">아이디</label>
            <input type="text" id="userId">
        </div>

        <div class="input-row">
            <label for="userPwd">비밀번호</label>
            <input type="password" id="userPwd">
        </div>

        <button type="submit">관리고객 출력</button>
    </form>

    <div id="result"></div>
</body>
</html>
