<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인 페이지</title>
    <script>
        function formCheck(event) {
            // submit 버튼을 클릭했을 때 action 속성의 특정 URL로 넘어가지 않도록 방지
            event.preventDefault();

            // 입력받은 아이디와 비밀번호 값 가져오기
            const userId = document.loginForm.userid.value;
            const passwd = document.loginForm.passwd.value;

            // 콘솔 창에 아이디와 비밀번호 출력
            console.log("아이디 : " + userId);
            console.log("비밀번호 : " + passwd);

            // 로그인 정보 체크 (아이디: tom, 비밀번호: 111)
            if (userId === "tom" && passwd === "111") {
                alert("로그인 성공");
            } else {
                alert("로그인 실패");
            }
        }
    </script>
</head>
<body>

    <!-- 폼 태그 설정: 파일명 aa.html, 요청방식 get, onsubmit 이벤트 바인딩 -->
    <form action="aa.html" name="loginForm" method="get" onsubmit="formCheck(event)">
        <label for="userid">아이디 : </label>
        <input type="text" id="userid" name="userid" required><br><br>

        <label for="passwd">비밀번호 : </label>
        <input type="password" id="passwd" name="passwd" required><br><br>

        <input type="submit" value="로그인">
    </form>

</body>
</html>
